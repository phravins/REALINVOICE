[workspace]
resolver = "2"
members = [
    "core",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/phravins/realinvoice"

[workspace.dependencies]
realinvoice-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
bcrypt = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
