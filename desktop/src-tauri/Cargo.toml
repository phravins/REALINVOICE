[package]
name = "realinvoice-desktop"
description = "RealInvoice Office Console — the billing counter's native shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Named so the desktop shell can also be driven from integration tests and, later,
# from the mobile targets Tauri v2 supports.
name = "realinvoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
realinvoice-core = { workspace = true }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
