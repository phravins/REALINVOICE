[package]
name = "realinvoice-core"
description = "Shared schema, GST calculation and SQLite access layer for RealInvoice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The push worker needs an async runtime and an HTTP client. On by default so the desktop
# app and the tests get it without ceremony, and behind a feature so the Logistics Desk
# TUI — which has no business linking a TLS stack — can turn it off.
default = ["sync"]
sync = ["dep:tokio", "dep:reqwest"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
bcrypt = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
